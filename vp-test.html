<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Diagnostic page for the Chrome-on-iOS landscape band. Not part of the app.
     Open with ?cover to try viewport-fit=cover. -->
<script>
  const cover = location.search.includes('cover');
  document.write('<meta name="viewport" content="width=device-width, initial-scale=1' + (cover ? ', viewport-fit=cover' : '') + '">');
</script>
<title>vp test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
               font: 14px/1.4 -apple-system, Helvetica, sans-serif; }
  /* The whole reported viewport, with a loud edge so its true extent shows in
     a screenshot. Anything grey outside the red line is glass the page was
     not given. */
  #box { position: fixed; inset: 0; height: 100dvh; box-sizing: border-box;
         border: 4px solid #f33; background: #123; padding: 8px; overflow: auto; }
  #box > * { max-width: 100%; }
  pre { margin: 6px 0; white-space: pre-wrap; font-size: 13px; }
  button { font: inherit; padding: 8px 12px; margin: 4px 6px 4px 0; border-radius: 8px;
           border: 1px solid #8ab; background: #246; color: #fff; }
  #m-dvh { height: 100dvh; } #m-svh { height: 100svh; } #m-lvh { height: 100lvh; }
  #m-env { padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px);
           padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
  .m { position: absolute; visibility: hidden; width: 0; }
  #log { color: #9cf; }
</style>
</head>
<body>
<div id="box">
  <div><b>viewport test</b> (<span id="mode"></span>)
    <button onclick="rewriteMeta()">1 rewrite meta</button>
    <button onclick="nudge()">2 nudge scroll</button>
    <button onclick="location.reload()">3 reload</button>
    <button onclick="location.search = cover ? '' : '?cover'">toggle cover</button>
  </div>
  <pre id="out"></pre>
  <pre id="log"></pre>
</div>
<div class="m" id="m-dvh"></div><div class="m" id="m-svh"></div><div class="m" id="m-lvh"></div><div class="m" id="m-env"></div>

<script>
  const $ = id => document.getElementById(id);
  $('mode').textContent = cover ? 'viewport-fit=cover' : 'plain viewport';
  const h = id => Math.round($(id).getBoundingClientRect().height);
  function report(){
    const vv = window.visualViewport, cs = getComputedStyle($('m-env'));
    const o = (screen.orientation && screen.orientation.type) || (innerWidth > innerHeight ? 'landscape?' : 'portrait?');
    return [
      `orientation      ${o}`,
      `inner            ${innerWidth} x ${innerHeight}`,
      `visualViewport   ${vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) + '  scale ' + vv.scale.toFixed(2) + '  offY ' + Math.round(vv.offsetTop) : 'n/a'}`,
      `docElement       ${document.documentElement.clientWidth} x ${document.documentElement.clientHeight}`,
      `screen           ${screen.width} x ${screen.height}   avail ${screen.availWidth} x ${screen.availHeight}`,
      `100dvh/svh/lvh   ${h('m-dvh')} / ${h('m-svh')} / ${h('m-lvh')}`,
      `safe-area t/r/b/l ${cs.paddingTop} / ${cs.paddingRight} / ${cs.paddingBottom} / ${cs.paddingLeft}`,
      `#box drawn       ${Math.round($('box').getBoundingClientRect().width)} x ${Math.round($('box').getBoundingClientRect().height)}`,
      `devicePixelRatio ${devicePixelRatio}`,
      `ua               ${navigator.userAgent.replace(/^.*?\(/, '(')}`,
    ].join('\n');
  }
  const lines = [];
  function log(why){
    lines.unshift(`${new Date().toTimeString().slice(0,8)} ${why}: inner ${innerWidth}x${innerHeight}` +
      (visualViewport ? ` vv ${Math.round(visualViewport.width)}x${Math.round(visualViewport.height)}` : ''));
    if (lines.length > 12) lines.pop();
    $('log').textContent = lines.join('\n');
    $('out').textContent = report();
  }
  addEventListener('resize', () => log('resize'));
  addEventListener('orientationchange', () => { log('orientationchange'); setTimeout(() => log('  +400ms'), 400); });
  if (window.visualViewport) visualViewport.addEventListener('resize', () => log('vv resize'));
  if (screen.orientation) screen.orientation.addEventListener('change', () => log('screen.orientation'));
  setInterval(() => { $('out').textContent = report(); }, 500);
  log('load');

  /* Candidate 1: rewrite the viewport meta so WebKit recomputes the viewport. */
  function rewriteMeta(){
    const vp = document.querySelector('meta[name=viewport]');
    const base = vp.getAttribute('content');
    vp.setAttribute('content', base + ', maximum-scale=1');
    setTimeout(() => { vp.setAttribute('content', base); log('meta rewritten'); }, 300);
  }
  /* Candidate 2: give the document 2px of scroll, scroll it, take it back —
     the toolbar logic in Chrome listens to the scroll view. */
  function nudge(){
    const de = document.documentElement;
    de.style.height = 'calc(100% + 2px)'; document.body.style.overflow = 'visible'; de.style.overflow = 'visible';
    window.scrollTo(0, 2);
    setTimeout(() => { window.scrollTo(0, 0); de.style.height = ''; de.style.overflow = ''; document.body.style.overflow = ''; log('nudged'); }, 300);
  }
</script>
</body>
</html>
